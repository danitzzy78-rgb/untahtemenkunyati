<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Untuk Kamu — Sebuah Hadiah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c16; --bg-2:#12162a; --bg-3:#191f38;
    --gold:#d8b26a; --gold-light:#f2dfae; --rose:#d99aa0; --maroon:#4a1f2b;
    --cream:#f6ede0; --dim:rgba(246,237,224,0.62); --line:rgba(216,178,106,0.28);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{height:100%;overflow:hidden;background:#000;}
  body{
    font-family:'Manrope',sans-serif; color:var(--cream);
    display:flex; align-items:center; justify-content:center;
  }
  h1,h2,h3,.serif{font-family:'Fraunces',serif;font-weight:500;}
  .eyebrow{font-family:'Manrope',sans-serif;letter-spacing:.3em;text-transform:uppercase;font-size:.62rem;color:var(--gold);display:flex;align-items:center;justify-content:center;gap:8px;}
  .eyebrow::before,.eyebrow::after{content:"";width:18px;height:1px;background:var(--gold);opacity:.6;}

  /* ---------- Device frame (desktop) ---------- */
  #device{
    position:relative; width:100%; height:100%;
    max-width:430px; max-height:100dvh;
    background:var(--bg); overflow:hidden;
  }
  @media (min-width:560px){
    body{ background: radial-gradient(circle at 50% 30%, #1a1330, #05050a 75%); }
    #device{
      height:min(880px,94dvh); border-radius:38px; border:10px solid #050608;
      box-shadow:0 40px 90px rgba(0,0,0,.6), inset 0 0 0 2px rgba(216,178,106,0.15);
    }
    #device::before{
      content:""; position:absolute; top:0; left:50%; transform:translateX(-50%);
      width:120px; height:22px; background:#050608; border-radius:0 0 16px 16px; z-index:80;
    }
  }

  .bg-glow{position:absolute;inset:0;z-index:0;pointer-events:none;
    background: radial-gradient(500px 400px at 20% 0%, rgba(216,178,106,0.10), transparent 60%),
                radial-gradient(500px 500px at 90% 30%, rgba(217,154,160,0.08), transparent 60%),
                radial-gradient(700px 500px at 50% 100%, rgba(74,31,43,0.4), transparent 60%);}
  #stars{position:absolute; inset:0; z-index:0;}

  /* ---------- Progress bar ---------- */
  #progress{
    position:absolute; top:14px; left:14px; right:14px; z-index:70;
    display:flex; gap:4px;
  }
  #progress .seg{flex:1;height:3px;background:rgba(246,237,224,0.2);border-radius:2px;overflow:hidden;}
  #progress .seg i{display:block;height:100%;width:0%;background:var(--gold-light);transition:width .25s linear;}
  #progress .seg.done i{width:100%;}

  /* ---------- Music toggle ---------- */
  #music-btn{
    position:absolute; top:28px; right:14px; z-index:70;
    width:36px;height:36px;border-radius:50%;
    background:rgba(18,22,42,0.75); border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:.9rem;cursor:pointer;
    backdrop-filter:blur(6px);
  }
  #music-btn.spin{animation:spin 3s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- Track / slides ---------- */
  #track{position:absolute;inset:0;display:flex;height:100%;width:100%;transition:transform .5s cubic-bezier(.4,0,.2,1);will-change:transform;}
  .slide{flex:0 0 100%;height:100%;position:relative;display:flex;align-items:center;justify-content:center;padding:70px 26px 34px;}
  .slide-inner{max-width:360px;width:100%;max-height:100%;overflow-y:auto;text-align:center;scrollbar-width:none;}
  .slide-inner::-webkit-scrollbar{display:none;}

  /* ---------- Nav zones & arrows ---------- */
  .tap-zone{position:absolute;top:0;bottom:0;width:20%;z-index:40;}
  .tap-zone.left{left:0;} .tap-zone.right{right:0;}
  .nav-arrow{
    position:absolute; bottom:16px; z-index:60; width:38px;height:38px;border-radius:50%;
    background:rgba(18,22,42,0.65); border:1px solid var(--line); color:var(--cream);
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;
    backdrop-filter:blur(6px);
  }
  #nav-prev{left:14px;} #nav-next{right:14px;}
  .nav-arrow.hidden{opacity:0;pointer-events:none;}

  /* ---------- generic bits ---------- */
  .big-title{font-size:clamp(1.9rem,7.5vw,2.5rem);line-height:1.12;color:var(--gold-light);margin:14px 0 8px;text-shadow:0 0 30px rgba(216,178,106,0.25);}
  .sub{color:var(--dim);font-style:italic;font-size:.92rem;}
  .tap-hint{margin-top:34px;font-size:.62rem;letter-spacing:.25em;text-transform:uppercase;color:var(--dim);opacity:.65;animation:bob 2.2s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(7px);}}

  /* Lock slide */
  .lock-time{font-family:'Fraunces',serif;font-size:3.6rem;color:var(--cream);letter-spacing:.02em;}
  .lock-date{color:var(--dim);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;margin-top:6px;}
  .lock-msg{margin-top:70px;font-family:'Fraunces',serif;font-style:italic;font-size:1.1rem;color:var(--gold-light);}

  /* Notification slide */
  .notif-card{
    background:rgba(20,25,46,0.85); border:1px solid var(--line); border-radius:18px;
    padding:20px; display:flex; gap:14px; align-items:flex-start; text-align:left;
    box-shadow:0 20px 50px rgba(0,0,0,0.5); cursor:pointer;
  }
  .notif-icon{width:42px;height:42px;border-radius:12px;background:linear-gradient(160deg,var(--gold),#a97c34);display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex:0 0 auto;}
  .notif-title{font-weight:700;font-size:.85rem;}
  .notif-sub{color:var(--dim);font-size:.78rem;margin-top:3px;}
  .notif-time{color:var(--dim);font-size:.65rem;margin-left:auto;}

  /* Gift slide */
  .gift-box{font-size:5.5rem;cursor:pointer;transition:transform .2s;filter:drop-shadow(0 10px 30px rgba(216,178,106,0.3));}
  .gift-box:active{transform:scale(.9);}
  .gift-box.opened{animation:pop .5s ease;}
  @keyframes pop{0%{transform:scale(1);}50%{transform:scale(1.3) rotate(-6deg);}100%{transform:scale(0);opacity:0;}}

  /* Countdown */
  .cd-row{display:flex;gap:10px;justify-content:center;margin-top:26px;flex-wrap:wrap;}
  .cd-box{background:linear-gradient(160deg,var(--bg-3),var(--bg-2));border:1px solid var(--line);border-radius:12px;width:66px;padding:12px 0;}
  .cd-box .num{font-family:'Fraunces',serif;font-size:1.5rem;color:var(--gold-light);}
  .cd-box .lbl{font-size:.55rem;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);display:block;margin-top:2px;}

  /* Card (letter / closing) */
  .card{background:linear-gradient(165deg,rgba(25,31,56,0.75),rgba(18,22,42,0.8));border:1px solid var(--line);border-radius:18px;padding:28px 22px;box-shadow:0 20px 50px rgba(0,0,0,0.45);text-align:left;}
  .letter-body{font-size:.92rem;line-height:1.8;min-height:1em;white-space:pre-wrap;}
  .cursor-blink{display:inline-block;width:2px;height:1em;background:var(--gold);vertical-align:middle;animation:blink 1s step-end infinite;margin-left:2px;}
  @keyframes blink{50%{opacity:0;}}
  .signature{margin-top:18px;font-style:italic;color:var(--gold);font-family:'Fraunces',serif;font-size:1rem;text-align:right;}

  .love-counter{display:flex;align-items:baseline;justify-content:center;gap:8px;margin-top:22px;}
  .love-counter .n{font-family:'Fraunces',serif;font-size:2rem;color:var(--rose);}
  .love-counter .t{color:var(--dim);font-size:.72rem;text-align:left;line-height:1.3;}

  /* Timeline */
  .t-item{display:flex;gap:14px;text-align:left;margin-bottom:20px;}
  .t-dot{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;background:var(--bg-2);font-size:.7rem;}
  .t-date{font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);margin-bottom:3px;}
  .t-text{color:var(--dim);font-size:.82rem;line-height:1.5;}

  /* Photo slide */
  .polaroid{background:#f4efe6;padding:10px 10px 30px;border-radius:4px;box-shadow:0 20px 40px rgba(0,0,0,0.5);width:100%;max-width:280px;margin:0 auto;}
  .polaroid .ph{width:100%;aspect-ratio:1/1.05;border-radius:3px;background:linear-gradient(135deg,var(--bg-3),var(--maroon));display:flex;align-items:center;justify-content:center;color:rgba(246,237,224,0.5);font-size:.72rem;text-align:center;padding:8px;}
  .polaroid .cap{margin-top:8px;text-align:center;font-family:'Fraunces',serif;font-style:italic;color:#2a2420;font-size:.8rem;}
  .photo-counter{margin-top:16px;font-size:.65rem;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;}

  /* Mixtape / video */
  .cassette{background:linear-gradient(160deg,#20263f,#12162a);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,0.4);}
  .cassette-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cassette-label{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);}
  .reel-row{display:flex;justify-content:center;gap:44px;margin-bottom:12px;}
  .reel{width:32px;height:32px;border-radius:50%;border:2px solid var(--gold);position:relative;background:radial-gradient(circle,var(--bg-2) 40%,transparent 41%);}
  .reel::before,.reel::after{content:"";position:absolute;top:50%;left:50%;width:2px;height:26px;background:var(--gold);opacity:.5;}
  .reel::before{transform:translate(-50%,-50%) rotate(0deg);}
  .reel::after{transform:translate(-50%,-50%) rotate(90deg);}
  .reel.spin{animation:spin 2.6s linear infinite;}
  video{width:100%;border-radius:10px;display:block;background:#000;max-height:38vh;}
  .video-note{text-align:center;font-size:.68rem;color:var(--dim);margin-top:10px;font-style:italic;}

  /* Final slide */
  #fire-canvas{position:absolute;inset:0;z-index:1;pointer-events:none;}
  .final-title{font-size:clamp(2.1rem,8vw,2.8rem);color:var(--gold-light);text-shadow:0 0 40px rgba(216,178,106,.4);}
  .replay-btn{margin-top:30px;background:transparent;border:1px solid var(--gold);color:var(--gold-light);padding:12px 28px;border-radius:999px;font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;}
  .replay-btn:active{background:var(--gold);color:#1a1206;}

  .petal{position:absolute;z-index:1;pointer-events:none;color:var(--rose);opacity:.5;animation:fall linear infinite;}
  @keyframes fall{0%{transform:translateY(-8%) rotate(0deg);}100%{transform:translateY(108%) rotate(360deg);}}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>

<div id="device">
  <div class="bg-glow"></div>
  <canvas id="stars"></canvas>
  <div id="petals"></div>

  <div id="progress"></div>
  <div id="music-btn">♪</div>

  <div id="track"></div>

  <div class="tap-zone left" id="zone-prev"></div>
  <div class="tap-zone right" id="zone-next"></div>
  <div class="nav-arrow" id="nav-prev">‹</div>
  <div class="nav-arrow" id="nav-next">›</div>
</div>

<audio id="audio-player" loop>
  <source id="audio-source" src="musik/laskar-pelangi.mp3" type="audio/mpeg">
</audio>

<script>
/* =========================================================
   KONFIGURASI — GANTI SESUAI DATA KAMU
   ========================================================= */
const CONFIG = {
  recipientName: "Sayangku",
  fromName: "Aku",
  birthdayDate: "2026-09-01T00:00:00+07:00",
  togetherSince: "2023-02-14",
  photoCount: 6,
  photoCaptions: ["Momen ini ♥","Ketawa terus","Tak terlupakan","Favorit banget","Selalu diingat","Bahagia itu ini"],
  letter1: "Hari ini adalah hari yang paling spesial, karena hari ini adalah hari lahirnya orang yang paling berarti dalam hidupku.\n\nTerima kasih sudah selalu ada, sudah bikin hari-hariku jauh lebih hangat. Aku bersyukur banget bisa mengenalmu.",
  letter2: "Aku doain kamu selalu sehat, selalu bahagia, dan selalu jadi versi terbaik dari dirimu sendiri.\n\nMakasih sudah jadi kamu. Selamat ulang tahun, sayangku. Aku sayang kamu, sekarang dan nanti.",
  timeline: [
    { date: "Awal Cerita", text: "Ganti dengan cerita gimana kalian pertama kali kenal." },
    { date: "Momen Berkesan", text: "Ceritain satu momen yang paling kalian ingat berdua." },
    { date: "Hari Ini", text: "Merayakan hari lahirmu dengan penuh syukur." }
  ],
  songs: [
    { name: "Laskar Pelangi", file: "musik/laskar-pelangi.mp3" },
    { name: "The One That Got Away", file: "musik/the-one-that-got-away.mp3" }
  ]
};

const isFuture = new Date(CONFIG.birthdayDate).getTime() > Date.now();

/* =========================================================
   SUSUN SLIDE
   ========================================================= */
let slides = [];
slides.push({type:'lock'});
slides.push({type:'notif'});
slides.push({type:'gift'});
if(isFuture) slides.push({type:'countdown'});
slides.push({type:'greeting'});
slides.push({type:'letter', text: CONFIG.letter1, sign: `— ${CONFIG.fromName}, dengan sayang`, showCounter:true});
slides.push({type:'timeline'});
for(let i=1;i<=CONFIG.photoCount;i++) slides.push({type:'photo', index:i});
slides.push({type:'video', side:'a'});
slides.push({type:'video', side:'b'});
slides.push({type:'letter', text: CONFIG.letter2, sign: `— dari ${CONFIG.fromName}, untuk kamu`, eyebrow:'Sebelum Ditutup', title:'Satu Doa Terakhir'});
slides.push({type:'final'});

const track = document.getElementById('track');
const progressEl = document.getElementById('progress');
let current = 0;
let typed = new Set();

/* ---------- Render helpers ---------- */
function renderSlide(s, i){
  const el = document.createElement('div');
  el.className = 'slide';
  el.dataset.index = i;

  if(s.type === 'lock'){
    el.innerHTML = `<div class="slide-inner">
      <div class="lock-time" id="lock-time">--:--</div>
      <div class="lock-date" id="lock-date">-</div>
      <div class="lock-msg">Ada sesuatu untukmu, ${CONFIG.recipientName} ✦</div>
      <div class="tap-hint">sentuh layar untuk membuka</div>
    </div>`;
  }
  else if(s.type === 'notif'){
    el.innerHTML = `<div class="slide-inner">
      <div class="eyebrow" style="margin-bottom:26px;">Notifikasi</div>
      <div class="notif-card" id="notif-card">
        <div class="notif-icon">🎁</div>
        <div style="flex:1;">
          <div class="notif-title">1 hadiah baru</div>
          <div class="notif-sub">Dari: ${CONFIG.fromName} ❤️ — tap untuk membuka</div>
        </div>
        <div class="notif-time">now</div>
      </div>
      <div class="tap-hint">ketuk notifikasinya</div>
    </div>`;
  }
  else if(s.type === 'gift'){
    el.innerHTML = `<div class="slide-inner">
      <div class="eyebrow" style="margin-bottom:22px;">Untukmu</div>
      <div class="gift-box" id="gift-box">🎁</div>
      <div class="sub" style="margin-top:22px;">ketuk kotaknya untuk membuka</div>
    </div>`;
  }
  else if(s.type === 'countdown'){
    el.innerHTML = `<div class="slide-inner">
      <div class="eyebrow">Menghitung Hari</div>
      <h1 class="big-title">Hari Spesialmu<br>Sudah Dekat</h1>
      <p class="sub">Semua yang indah sedang menunggu waktunya ✦</p>
      <div class="cd-row" id="cd-row">
        <div class="cd-box"><span class="num" id="cd-d">00</span><span class="lbl">Hari</span></div>
        <div class="cd-box"><span class="num" id="cd-h">00</span><span class="lbl">Jam</span></div>
        <div class="cd-box"><span class="num" id="cd-m">00</span><span class="lbl">Menit</span></div>
        <div class="cd-box"><span class="num" id="cd-s">00</span><span class="lbl">Detik</span></div>
      </div>
      <div class="tap-hint">ketuk untuk lanjut</div>
    </div>`;
  }
  else if(s.type === 'greeting'){
    el.innerHTML = `<div class="slide-inner">
      <div class="eyebrow">Untuk Kamu</div>
      <h1 class="big-title">Selamat Ulang<br>Tahun, ${CONFIG.recipientName}</h1>
      <p class="sub">semoga hari ini penuh hal-hal baik ✦</p>
      <div class="tap-hint">ketuk untuk baca suratnya</div>
    </div>`;
  }
  else if(s.type === 'letter'){
    el.innerHTML = `<div class="slide-inner">
      <div class="eyebrow" style="margin-bottom:14px;">${s.eyebrow || 'Sebuah Surat'}</div>
      <div class="card">
        <h2 style="font-size:1.3rem;color:var(--gold-light);margin-bottom:12px;">${s.title || 'Untukmu'}</h2>
        <div class="letter-body" data-fulltext="${encodeURIComponent(s.text)}" id="letter-${i}"></div>
        <div class="signature">${s.sign}</div>
      </div>
      ${s.showCounter ? `<div class="love-counter">
        <span class="n" id="days-together">0000</span>
        <span class="t">hari kita bersama,<br>dan terus bertambah</span>
      </div>` : ''}
    </div>`;
  }
  else if(s.type === 'timeline'){
    const items = CONFIG.timeline.map(t => `
      <div class="t-item"><div class="t-dot">✦</div>
        <div><div class="t-date">${t.date}</div><div class="t-text">${t.text}</div></div>
      </div>`).join('');
    el.innerHTML = `<div class="slide-inner">
      <div class="eyebrow" style="margin-bottom:20px;">Kisah Kita</div>
      ${items}
    </div>`;
  }
  else if(s.type === 'photo'){
    const cap = CONFIG.photoCaptions[(s.index-1) % CONFIG.photoCaptions.length];
    el.innerHTML = `<div class="slide-inner">
      <div class="eyebrow" style="margin-bottom:18px;">Galeri Kenangan</div>
      <div class="polaroid">
        <div class="ph">Ganti dengan<br>foto/foto-${s.index}.jpg</div>
        <div class="cap">${cap}</div>
      </div>
      <div class="photo-counter">Foto ${s.index} / ${CONFIG.photoCount}</div>
    </div>`;
  }
  else if(s.type === 'video'){
    const label = s.side === 'a' ? 'Side A — Pesan Pertama' : 'Side B — Pesan Kedua';
    const file = s.side === 'a' ? 'video/pesan-1.mp4' : 'video/pesan-2.mp4';
    el.innerHTML = `<div class="slide-inner">
      <div class="eyebrow" style="margin-bottom:16px;">Sebuah Mixtape</div>
      <div class="cassette">
        <div class="cassette-top"><span class="cassette-label">${label}</span></div>
        <div class="reel-row"><div class="reel" id="reel-l-${s.side}"></div><div class="reel" id="reel-r-${s.side}"></div></div>
        <video controls id="video-${s.side}"><source src="${file}" type="video/mp4">Video tidak didukung.</video>
        <p class="video-note">Ganti file <code>${file}</code> dengan video aslimu.</p>
      </div>
    </div>`;
  }
  else if(s.type === 'final'){
    el.innerHTML = `
      <canvas id="fire-canvas"></canvas>
      <div class="slide-inner" style="position:relative;z-index:2;">
        <div class="eyebrow" style="margin-bottom:14px;">Penutup</div>
        <h1 class="final-title">Happy Birthday,<br>${CONFIG.recipientName} 🎉</h1>
        <p class="sub" style="margin-top:14px;">dibuat dengan ♥ khusus untuk hari spesialmu</p>
        <button class="replay-btn" id="replay-btn">✦ Putar Ulang ✦</button>
      </div>`;
  }
  return el;
}

slides.forEach((s,i)=> track.appendChild(renderSlide(s,i)));
slides.forEach((_,i)=>{
  const seg = document.createElement('div');
  seg.className = 'seg';
  seg.innerHTML = '<i></i>';
  progressEl.appendChild(seg);
});

/* =========================================================
   NAVIGASI (klik / tap, tanpa scroll halaman)
   ========================================================= */
function updateProgress(){
  [...progressEl.children].forEach((seg,i)=>{
    seg.classList.toggle('done', i <= current);
    seg.querySelector('i').style.width = i <= current ? '100%' : '0%';
  });
}
function updateArrows(){
  document.getElementById('nav-prev').classList.toggle('hidden', current === 0);
  document.getElementById('nav-next').classList.toggle('hidden', current === slides.length-1);
}
function goTo(i){
  if(i < 0 || i >= slides.length) return;
  current = i;
  track.style.transform = `translateX(-${current*100}%)`;
  updateProgress();
  updateArrows();
  onEnter(current);
}
function next(){ if(current < slides.length-1) goTo(current+1); }
function prev(){ if(current > 0) goTo(current-1); }

document.getElementById('zone-next').addEventListener('click', next);
document.getElementById('zone-prev').addEventListener('click', prev);
document.getElementById('nav-next').addEventListener('click', next);
document.getElementById('nav-prev').addEventListener('click', prev);
document.addEventListener('keydown', (e)=>{
  if(e.key === 'ArrowRight') next();
  if(e.key === 'ArrowLeft') prev();
});
let touchX = null;
document.getElementById('device').addEventListener('touchstart', e=>{ touchX = e.touches[0].clientX; });
document.getElementById('device').addEventListener('touchend', e=>{
  if(touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if(Math.abs(dx) > 50){ dx < 0 ? next() : prev(); }
  touchX = null;
});

/* =========================================================
   PER-SLIDE BEHAVIOUR
   ========================================================= */
function onEnter(i){
  const s = slides[i];

  if(s.type === 'letter' && !typed.has(i)){
    typed.add(i);
    const el = document.getElementById('letter-'+i);
    const text = decodeURIComponent(el.dataset.fulltext);
    let c = 0;
    el.innerHTML = '<span class="cursor-blink"></span>';
    const iv = setInterval(()=>{
      c++;
      el.innerHTML = escapeHtml(text.slice(0,c)).replace(/\n/g,'<br>') + '<span class="cursor-blink"></span>';
      if(c >= text.length){ clearInterval(iv); }
    }, 18);
    if(s.showCounter) updateLoveCounter();
  }
  if(s.type === 'countdown'){ startCountdown(); } else { stopCountdown(); }
  if(s.type === 'final'){ startFireworks(); } else { stopFireworks(); }
}
function escapeHtml(str){ return str.replace(/[&<>]/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;' }[c])); }

/* Lock clock */
function tickClock(){
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const mm = String(now.getMinutes()).padStart(2,'0');
  const t = document.getElementById('lock-time');
  const d = document.getElementById('lock-date');
  if(t) t.textContent = `${hh}:${mm}`;
  if(d) d.textContent = now.toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long' });
}
tickClock(); setInterval(tickClock, 1000*10);

/* Countdown */
let cdInterval = null;
function startCountdown(){
  if(cdInterval) return;
  const tick = ()=>{
    const diff = new Date(CONFIG.birthdayDate).getTime() - Date.now();
    if(diff <= 0){ stopCountdown(); return; }
    const d = Math.floor(diff/86400000), h = Math.floor(diff/3600000)%24,
          m = Math.floor(diff/60000)%60, sec = Math.floor(diff/1000)%60;
    const set = (id,v)=>{ const e=document.getElementById(id); if(e) e.textContent = String(v).padStart(2,'0'); };
    set('cd-d',d); set('cd-h',h); set('cd-m',m); set('cd-s',sec);
  };
  tick(); cdInterval = setInterval(tick, 1000);
}
function stopCountdown(){ if(cdInterval){ clearInterval(cdInterval); cdInterval=null; } }

/* Love counter */
function updateLoveCounter(){
  const el = document.getElementById('days-together');
  if(!el) return;
  const start = new Date(CONFIG.togetherSince).getTime();
  const days = Math.max(0, Math.floor((Date.now()-start)/86400000));
  el.textContent = String(days).padStart(4,'0');
}

/* Gift open */
document.addEventListener('click', (e)=>{
  const box = e.target.closest('#gift-box');
  if(box && !box.classList.contains('opened')){
    box.classList.add('opened');
    burstConfetti();
    setTimeout(next, 550);
  }
  const notif = e.target.closest('#notif-card');
  if(notif){ next(); }
  const lockMsg = e.target.closest('.lock-time, .lock-date, .lock-msg, .tap-hint');
  if(lockMsg && slides[current].type === 'lock'){ next(); }
  const replay = e.target.closest('#replay-btn');
  if(replay){ goTo(0); }
});

/* Video reel spin */
document.addEventListener('play', (e)=>{
  if(e.target.tagName === 'VIDEO'){
    const side = e.target.id.split('-')[1];
    document.getElementById('reel-l-'+side)?.classList.add('spin');
    document.getElementById('reel-r-'+side)?.classList.add('spin');
  }
}, true);
document.addEventListener('pause', (e)=>{
  if(e.target.tagName === 'VIDEO'){
    const side = e.target.id.split('-')[1];
    document.getElementById('reel-l-'+side)?.classList.remove('spin');
    document.getElementById('reel-r-'+side)?.classList.remove('spin');
  }
}, true);

/* =========================================================
   MUSIK
   ========================================================= */
const audio = document.getElementById('audio-player');
const audioSource = document.getElementById('audio-source');
const musicBtn = document.getElementById('music-btn');
let songIdx = 0, musicStarted = false;

function tryStartMusic(){
  if(musicStarted) return;
  musicStarted = true;
  audio.play().then(()=>{ musicBtn.classList.add('spin'); }).catch(()=>{});
}
musicBtn.addEventListener('click', (ev)=>{
  ev.stopPropagation();
  if(audio.paused){
    if(!musicStarted){ tryStartMusic(); return; }
    audio.play(); musicBtn.classList.add('spin');
  } else {
    audio.pause(); musicBtn.classList.remove('spin');
  }
});
musicBtn.addEventListener('dblclick', (ev)=>{
  ev.stopPropagation();
  songIdx = (songIdx+1) % CONFIG.songs.length;
  audioSource.src = CONFIG.songs[songIdx].file;
  audio.load();
  if(musicStarted) audio.play().catch(()=>{});
});
/* mulai musik begitu user pertama kali menyentuh layar (lock screen) */
document.getElementById('device').addEventListener('click', tryStartMusic, { once:true });

/* =========================================================
   AMBIENT: bintang & kelopak
   ========================================================= */
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
let stars = [];
function sizeCanvas(){
  const r = document.getElementById('device').getBoundingClientRect();
  canvas.width = r.width; canvas.height = r.height;
  stars = Array.from({length:70}, ()=>({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*1.2+.2,a:Math.random()}));
}
function drawStars(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = '#f2dfae';
  stars.forEach(s=>{
    s.a += (Math.random()-0.5)*0.02; s.a = Math.max(0.1,Math.min(1,s.a));
    ctx.globalAlpha = s.a; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;
  requestAnimationFrame(drawStars);
}
window.addEventListener('resize', sizeCanvas);
sizeCanvas(); drawStars();

const petalHost = document.getElementById('petals');
for(let i=0;i<10;i++){
  const p = document.createElement('div');
  p.className='petal'; p.textContent=['✦','♥','✧'][i%3];
  p.style.left = Math.random()*100+'%';
  p.style.fontSize = (9+Math.random()*8)+'px';
  p.style.animationDuration = (9+Math.random()*10)+'s';
  p.style.animationDelay = (Math.random()*8)+'s';
  petalHost.appendChild(p);
}

/* =========================================================
   CONFETTI (buka kado)
   ========================================================= */
function burstConfetti(){
  const device = document.getElementById('device');
  const rect = device.getBoundingClientRect();
  const colors = ['#d8b26a','#d99aa0','#f2dfae'];
  for(let i=0;i<36;i++){
    const c = document.createElement('div');
    const size = 5+Math.random()*5;
    c.style.position='absolute';
    c.style.left = (rect.width/2)+'px';
    c.style.top = (rect.height*0.4)+'px';
    c.style.width = size+'px'; c.style.height = size+'px';
    c.style.background = colors[i%colors.length];
    c.style.borderRadius = Math.random()>0.5 ? '50%':'2px';
    c.style.zIndex = 90; c.style.pointerEvents='none';
    device.appendChild(c);
    const angle = Math.random()*Math.PI*2, dist = 80+Math.random()*160;
    const dx = Math.cos(angle)*dist, dy = Math.sin(angle)*dist - 60;
    c.animate([
      {transform:'translate(0,0) rotate(0deg)', opacity:1},
      {transform:`translate(${dx}px, ${dy+240}px) rotate(${Math.random()*360}deg)`, opacity:0}
    ], {duration:1200+Math.random()*500, easing:'cubic-bezier(.2,.8,.3,1)'});
    setTimeout(()=>c.remove(), 1900);
  }
}

/* =========================================================
   FIREWORKS (slide penutup)
   ========================================================= */
let fireCtx=null, fireParticles=[], fireRAF=null, fireInterval=null;
function startFireworks(){
  const cv = document.getElementById('fire-canvas');
  if(!cv) return;
  const rect = document.getElementById('device').getBoundingClientRect();
  cv.width = rect.width; cv.height = rect.height;
  fireCtx = cv.getContext('2d');
  fireParticles = [];
  function launch(){
    const x = Math.random()*cv.width, y = cv.height*0.3 + Math.random()*cv.height*0.3;
    const colors = ['#d8b26a','#f2dfae','#d99aa0','#ffffff'];
    const color = colors[Math.floor(Math.random()*colors.length)];
    for(let i=0;i<26;i++){
      const angle = (Math.PI*2/26)*i, speed = 1.2+Math.random()*1.6;
      fireParticles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:1,color});
    }
  }
  function frame(){
    fireCtx.clearRect(0,0,cv.width,cv.height);
    fireParticles.forEach(p=>{
      p.x += p.vx; p.y += p.vy; p.vy += 0.02; p.life -= 0.015;
      fireCtx.globalAlpha = Math.max(p.life,0);
      fireCtx.fillStyle = p.color;
      fireCtx.beginPath(); fireCtx.arc(p.x,p.y,2,0,Math.PI*2); fireCtx.fill();
    });
    fireCtx.globalAlpha = 1;
    fireParticles = fireParticles.filter(p=>p.life>0);
    fireRAF = requestAnimationFrame(frame);
  }
  launch();
  fireInterval = setInterval(launch, 1100);
  frame();
}
function stopFireworks(){
  if(fireRAF) cancelAnimationFrame(fireRAF);
  if(fireInterval) clearInterval(fireInterval);
  fireRAF=null; fireInterval=null; fireParticles=[];
}

/* Init */
updateProgress(); updateArrows(); onEnter(0);
